# Conda environment for the final year project.
# Windows. Create it with:
#     conda env create -f environment.yml
#     conda activate fyp
#
# PyTorch is deliberately NOT in this file. Conda's Windows packaging of CUDA
# builds is unreliable; install it with pip afterwards, per SETUP_RUNBOOK.md
# step 3. Everything else installs cleanly from conda-forge.

name: fyp

channels:
  - conda-forge

dependencies:
  - python=3.11

  # --- Earth Engine and geospatial ---
  - earthengine-api>=1.4
  - geemap>=0.35
  - gdal>=3.8
  - rasterio>=1.3
  - rioxarray>=0.15
  - xarray>=2024.1
  - geopandas>=0.14
  - shapely>=2.0
  - fiona>=1.9
  - pyproj>=3.6
  - pysheds>=0.4          # HAND and flow routing from a DEM

  # --- numerical and modelling ---
  - numpy>=1.26,<2.1
  - pandas>=2.1
  - openpyxl>=3.1          # pandas needs this to read .xlsx; its absence stopped screen_gauges.py
  - scipy>=1.11
  - scikit-learn>=1.4
  - scikit-image>=0.22    # Otsu thresholding lives here
  - xgboost>=2.0
  - imbalanced-learn>=0.12

  # --- figures ---
  - matplotlib>=3.8
  - contextily>=1.5

  # --- notebooks and utilities ---
  - jupyterlab>=4.0
  - ipywidgets>=8.1
  - tqdm>=4.66
  - requests>=2.31
  - pyyaml>=6.0
  - python-dotenv>=1.0
  - tabulate>=0.9          # gis_tools writes its reports with this; its absence stopped t02_mosaic

  - pip
  - pip:
      - opencv-python-headless>=4.9
      - hyp3-sdk>=7.7           # t07_download asf
      - earthaccess>=0.17       # t07_download earthdata
      - imdlib>=0.1.21         # t07_download imd
